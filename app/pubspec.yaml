name: smartagri_app
description: SmartAgri Advisor - farmer-facing app
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  google_mlkit_image_labeling: ^0.14.0
  path_provider: ^2.1.4
  geolocator: ^13.0.1
  flutter_local_notifications: ^17.2.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
